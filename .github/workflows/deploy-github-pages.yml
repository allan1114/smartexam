name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: write   # needed to push to gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔍 Type checking
        run: npm run type-check
        continue-on-error: true

      - name: 🧪 Run tests
        run: npm test -- --run
        continue-on-error: true

      - name: 🏗️ Build web app
        run: npm run build:web

      - name: 📁 Ensure SPA + Pages config (404 fallback + .nojekyll)
        run: |
          cp packages/web/dist/index.html packages/web/dist/404.html
          touch packages/web/dist/.nojekyll

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './packages/web/dist'

      - name: 📤 Upload dist artifact for gh-pages job
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: './packages/web/dist'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-gh-pages-branch:
    # Mirror the build output to the gh-pages branch so GitHub Pages sources
    # configured as "Deploy from a branch → gh-pages" stay up to date.
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: ⬇️ Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      - name: 🌐 Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Deploy ${{ github.sha }}"
          force_orphan: true
